name: Node CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
        working-directory: labs/github-actions/testing-lab

      - name: Run tests
        run: npm test
        working-directory: labs/github-actions/testing-lab
